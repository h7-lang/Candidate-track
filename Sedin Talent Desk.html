<style>
:root{
  --paper:#ECEFE8; --surface:#FAFBF7; --ink:#18221C; --muted:#5B675F; --line:#D2D8CE; --soft:#E3E8DF;
  --steel:#2F5D8A; --gold:#B87F00; --brick:#A5402C; --plum:#6A5F93; --leaf:#3B7651; --grey:#7C8580;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111714; --surface:#19211C; --ink:#E5EBE4; --muted:#9BA89F; --line:#2C3830; --soft:#212A24;
    --steel:#86AEDA; --gold:#E9B740; --brick:#E58069; --plum:#AFA3DA; --leaf:#80C298; --grey:#8E9993;
  }
}
:root[data-theme="dark"]{
  --paper:#111714; --surface:#19211C; --ink:#E5EBE4; --muted:#9BA89F; --line:#2C3830; --soft:#212A24;
  --steel:#86AEDA; --gold:#E9B740; --brick:#E58069; --plum:#AFA3DA; --leaf:#80C298; --grey:#8E9993;
}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; min-height:100%; background:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--steel); outline-offset:2px}
h1,h2,h3{font-family:var(--display); margin:0; font-weight:700; letter-spacing:-0.01em}
a{color:var(--steel)}
.app{display:grid; grid-template-columns:232px 1fr; min-height:100vh}
/* rail */
.rail{position:sticky; top:env(safe-area-inset-top,0px); height:100vh; padding:22px 16px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:22px; background:var(--paper)}
.brand{display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:2px 6px 0}
.logo{height:28px; width:auto; display:block}
.logo-d{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .logo-l{display:none} :root:not([data-theme="light"]) .logo-d{display:block} }
:root[data-theme="dark"] .logo-l{display:none} :root[data-theme="dark"] .logo-d{display:block}
.brand-sub b{font-family:var(--display); font-size:16px; display:block; line-height:1.15; letter-spacing:-.01em}
.brand-sub small{color:var(--muted); font-size:12px}
.brand-mark{width:32px; height:32px; border-radius:8px; background:var(--ink); color:var(--paper); display:grid; place-items:center; font-family:var(--display); font-weight:700; font-size:15px}
.brand b{font-family:var(--display); font-size:17px; display:block; line-height:1.15}
.brand small{color:var(--muted); font-size:12px}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{all:unset; cursor:pointer; padding:9px 12px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-weight:500}
.nav button:hover{background:var(--soft); color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface); color:var(--ink); box-shadow:inset 3px 0 0 var(--ink)}
.nav .count{font-size:12px; color:var(--muted)}
.rail-foot{margin-top:auto; font-size:12.5px; color:var(--muted); display:flex; flex-direction:column; gap:8px; padding:0 6px}
.sync{display:flex; gap:7px; align-items:center}
.dot{width:7px; height:7px; border-radius:50%; background:var(--leaf); flex:none}
.dot.local{background:var(--gold)}
.dot.off{background:var(--brick)}
.linkish{all:unset; cursor:pointer; color:var(--steel); text-decoration:underline; text-underline-offset:2px}
main{overflow-x:clip; padding:28px clamp(16px,3.4vw,44px) 60px; min-width:0}
.wrap{max-width:1180px; margin:0 auto}
.page-head{display:flex; flex-wrap:wrap; gap:14px 20px; align-items:flex-end; justify-content:space-between; margin-bottom:22px}
.page-head h1{font-size:clamp(26px,3.2vw,34px); line-height:1.1}
.page-head p{margin:6px 0 0; color:var(--muted)}
.actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
.btn{border:1px solid var(--line); background:var(--surface); padding:8px 14px; border-radius:8px; cursor:pointer; font-weight:500; display:inline-flex; gap:6px; align-items:center; white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.danger{color:var(--brick)}
.btn.sm{padding:5px 10px; font-size:13px}
.btn:disabled{opacity:.5; cursor:default}
select.ctl,input.ctl{border:1px solid var(--line); background:var(--surface); padding:8px 10px; border-radius:8px; min-width:0}
/* panels */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:20px}
.panel h2{font-size:18px; margin-bottom:4px}
.panel .sub{color:var(--muted); font-size:13px; margin:0 0 16px}
.grid2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px}
.grid3{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; margin-top:18px}
.grid-dash.qb{grid-template-columns:minmax(0,1fr) 300px; margin-top:0; align-items:start}
.grid-dash{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.3fr); gap:18px; margin-top:18px}
/* reading */
.reading{display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:28px; padding:26px 28px; background:var(--ink); color:var(--paper); border-radius:14px}
.reading h2{font-size:15px; font-family:var(--body); font-weight:600; opacity:.75; margin-bottom:14px}
.reading ol{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:12px}
.reading li{font-family:var(--display); font-size:clamp(17px,1.9vw,21px); line-height:1.32; font-weight:400; display:grid; grid-template-columns:14px 1fr; gap:10px}
.reading li::before{content:""; width:8px; height:8px; border-radius:2px; margin-top:.55em; background:var(--mk,#9ab)}
.reading li b{font-weight:700}
.kpis{display:grid; grid-template-columns:1fr 1fr; gap:18px 16px; align-content:start; border-left:1px solid color-mix(in srgb,var(--paper) 22%,transparent); padding-left:26px}
.kpi .n{font-family:var(--display); font-size:34px; font-weight:700; line-height:1}
.kpi .l{font-size:12.5px; opacity:.72; margin-top:4px}
/* funnel */
.funnel{display:flex; flex-direction:column; gap:10px}
.frow{display:grid; grid-template-columns:110px 1fr 54px; gap:12px; align-items:center}
.frow .lbl{font-size:13.5px; color:var(--muted)}
.ftrack{height:26px; background:var(--soft); border-radius:6px; overflow:hidden}
.fbar{height:100%; border-radius:6px; background:var(--c); min-width:4px; transition:width .5s ease}
.frow .val{font-family:var(--display); font-weight:700; font-size:18px; text-align:right}
.fconv{font-size:12px; color:var(--muted); padding-left:122px; margin-top:-6px}
.split{display:flex; height:10px; border-radius:5px; overflow:hidden; margin:8px 0 6px; background:var(--soft)}
.split span{display:block; height:100%}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted)}
.legend i{display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:5px; vertical-align:-1px}
/* tables */
.tbl-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{width:100%; border-collapse:collapse; font-size:14px}
th{text-align:left; font-weight:500; color:var(--muted); font-size:12.5px; padding:8px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:11px 10px; border-bottom:1px solid var(--soft); vertical-align:middle}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--soft)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums}
.who b{display:block; font-weight:600}
.who small{color:var(--muted)}
.ratio{display:flex; align-items:center; gap:8px; justify-content:flex-end}
.ratio .mini{width:60px; height:6px; background:var(--soft); border-radius:3px; overflow:hidden}
.ratio .mini span{display:block; height:100%; background:var(--gold)}
.pill{display:inline-flex; align-items:center; gap:6px; padding:3px 10px; border-radius:999px; font-size:12.5px; font-weight:600; color:var(--c); background:color-mix(in srgb,var(--c) 14%,transparent); white-space:nowrap}
.pill::before{content:""; width:6px; height:6px; border-radius:50%; background:var(--c)}
.age{font-variant-numeric:tabular-nums}
.age.warn{color:var(--brick); font-weight:600}
/* bars */
.hbars{display:flex; flex-direction:column; gap:9px}
.hb{display:grid; grid-template-columns:minmax(90px,150px) 1fr 30px; gap:10px; align-items:center; font-size:13.5px}
.hb .t{height:8px; background:var(--soft); border-radius:4px; overflow:hidden}
.hb .t span{display:block; height:100%; background:var(--c,var(--brick)); border-radius:4px}
.hb .v{text-align:right; font-variant-numeric:tabular-nums; color:var(--muted)}
.list{display:flex; flex-direction:column}
.li{display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--soft); cursor:pointer}
.li:last-child{border-bottom:0}
.li:hover .who b{text-decoration:underline}
.empty-note{color:var(--muted); font-size:14px; padding:6px 0}
svg text{fill:var(--muted); font-family:var(--body); font-size:11px}
/* filters */
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.filters input.ctl{flex:1 1 220px}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.chip{border:1px solid var(--line); background:transparent; border-radius:999px; padding:4px 11px; font-size:13px; cursor:pointer; color:var(--muted)}
.chip b{color:var(--ink); margin-left:4px}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--paper); border-color:var(--ink)}
.chip[aria-pressed="true"] b{color:var(--paper)}
.tag{display:inline-block; font-size:12px; padding:2px 8px; border-radius:5px; background:var(--soft); color:var(--muted); margin:2px 4px 2px 0}
/* empty */
.empty{padding:56px 24px; text-align:center; border:1px dashed var(--line); border-radius:14px; background:var(--surface)}
.empty h2{font-size:24px; margin-bottom:8px}
.empty p{color:var(--muted); max-width:52ch; margin:0 auto 20px}
/* drawer */
.scrim{position:fixed; inset:0; background:rgba(10,14,12,.38); z-index:20; opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.on{opacity:1; pointer-events:auto}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(620px,100%); background:var(--surface); z-index:21; transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column; border-left:1px solid var(--line); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.on{transform:none}
.dhead{padding:20px 24px 14px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; align-items:flex-start}
.dhead h2{font-size:22px; line-height:1.2}
.dhead p{margin:4px 0 0; color:var(--muted); font-size:14px}
.dbody{padding:20px 24px 40px; overflow-y:auto; flex:1}
.x{all:unset; cursor:pointer; width:32px; height:32px; display:grid; place-items:center; border-radius:8px; font-size:20px; color:var(--muted); flex:none}
.x:hover{background:var(--soft)}
.facts{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px 16px; margin-bottom:22px}
.facts div small{display:block; color:var(--muted); font-size:12px}
.facts div span{font-weight:500}
.sec{margin-top:24px}
.sec h3{font-size:16px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:10px}
.statusbox{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:12px; background:var(--soft); border-radius:10px}
.round{border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:10px}
.round-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start; flex-wrap:wrap}
.round-top b{font-family:var(--display); font-size:16px}
.round-top small{color:var(--muted); display:block}
.round ol{margin:10px 0 4px; padding-left:20px}
.round ol li{margin:3px 0}
.round .fb{font-size:14px; color:var(--muted); margin-top:8px; border-left:2px solid var(--line); padding-left:10px}
.round-actions{display:flex; gap:6px; margin-top:10px}
.timeline{list-style:none; padding:0; margin:0; font-size:13.5px}
.timeline li{display:flex; gap:10px; padding:5px 0; color:var(--muted)}
.timeline li span:first-child{width:92px; flex:none; font-variant-numeric:tabular-nums}
/* forms */
form.f{display:grid; grid-template-columns:1fr 1fr; gap:14px 14px}
.fld{display:flex; flex-direction:column; gap:5px; min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:13px; font-weight:500}
.fld label em{font-style:normal; color:var(--muted); font-weight:400}
.fld input,.fld select,.fld textarea{border:1px solid var(--line); background:var(--paper); border-radius:8px; padding:9px 11px; width:100%}
.fld textarea{min-height:84px; resize:vertical}
.fld .hint{font-size:12px; color:var(--muted)}
.form-actions{grid-column:1/-1; display:flex; gap:8px; justify-content:flex-end; margin-top:6px}
.inline-form{border:1px solid var(--steel); border-radius:10px; padding:16px; margin-bottom:12px; background:color-mix(in srgb,var(--steel) 5%,var(--surface))}
/* question bank */
.qgroup{margin-bottom:22px}
.qgroup h3{font-size:17px; margin-bottom:8px}
.q{display:grid; grid-template-columns:1fr auto; gap:10px; padding:10px 0; border-bottom:1px solid var(--soft)}
.q p{margin:0}
.q small{color:var(--muted); font-size:12.5px}
.times{font-family:var(--display); font-weight:700; color:var(--plum); font-size:15px; white-space:nowrap}
.ai-out{margin-top:12px; font-size:14.5px; line-height:1.6}
.ai-out h4{font-family:var(--display); font-size:15.5px; margin:16px 0 6px}
.ai-out ul{margin:4px 0; padding-left:20px}
.ai-box{border:1px solid var(--line); border-radius:10px; padding:16px; background:var(--paper)}
.attach{display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:var(--paper); flex-wrap:wrap}
.attach .ficon{width:34px; height:42px; border-radius:4px; background:var(--brick); color:#fff; font-size:10px; font-weight:700; display:grid; place-items:end center; padding-bottom:5px; flex:none; clip-path:polygon(0 0,72% 0,100% 22%,100% 100%,0 100%)}
.attach .fmeta{flex:1; min-width:140px}
.attach .fmeta b{display:block; font-weight:600; word-break:break-all; font-size:14px}
.attach .fmeta small{color:var(--muted)}
.drop{border:1.5px dashed var(--line); border-radius:10px; padding:14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; background:var(--paper)}
.drop.over{border-color:var(--steel); background:color-mix(in srgb,var(--steel) 7%,var(--paper))}
.drop .fmeta{flex:1; min-width:160px; font-size:14px}
.drop .fmeta small{display:block; color:var(--muted); font-size:12.5px}
.cand{border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px}
.cand-h{display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap}
.cand-h .who b{font-size:15.5px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.cr{margin-top:12px; padding-left:12px; border-left:2px solid var(--soft)}
.cr-h{display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px}
.cr-h b{font-size:14px}
.cr-h .pill{font-size:11.5px; padding:1px 8px}
.cr ol{margin:6px 0 0; padding-left:20px; font-size:14.5px}
.cr li{margin:3px 0}
.pill.xs{font-size:11px; padding:0 7px; gap:4px; vertical-align:1px}
.pill.xs::before{width:5px; height:5px}
.chips-l{font-size:12.5px; color:var(--muted); align-self:center; margin-right:4px}
.emp{display:inline-block; font-family:var(--body); font-size:11.5px; font-weight:600; color:var(--steel); background:color-mix(in srgb,var(--steel) 12%,transparent); border-radius:5px; padding:1px 6px; vertical-align:2px; letter-spacing:.02em}
.emp-cell{font-variant-numeric:tabular-nums; font-weight:500; white-space:nowrap}
.data-panel{margin-top:18px; display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap}
.data-panel > div:first-child{max-width:60ch}
.sec h3 .actions{gap:6px}
.notice{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); z-index:45; background:var(--surface); color:var(--ink); border:1px solid var(--line); box-shadow:0 8px 30px rgba(0,0,0,.18); border-radius:12px; padding:10px 10px 10px 16px; display:flex; gap:10px; align-items:center; max-width:min(560px,92vw); font-size:14px}
.fb-list{display:flex; flex-direction:column; gap:10px}
.fb{border:1px solid var(--line); border-left:4px solid var(--c); border-radius:10px; padding:12px 14px; background:var(--surface)}
.fb-who{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:6px}
.fb-who small{flex-basis:100%; color:var(--muted); font-size:12.5px; margin-top:-2px}
.fb-text{margin:0; white-space:pre-wrap; font-size:14.5px; line-height:1.55}
.fb-meta{display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--muted); margin-top:8px}
.fb-sent{color:var(--c); font-weight:600}
.fb-del{margin-left:auto; font-size:12.5px; color:var(--brick)}
.fb-count{color:var(--c); font-weight:600; margin-right:12px}
.sent-pick{display:flex; gap:6px; flex-wrap:wrap}
.sent-pick label{cursor:pointer}
.sent-pick input{position:absolute; opacity:0; width:1px; height:1px}
.sent-pick span{display:inline-block; padding:7px 12px; border:1px solid var(--line); border-radius:8px; font-size:13.5px; background:var(--paper)}
.sent-pick input:checked + span{border-color:var(--c); color:var(--c); background:color-mix(in srgb,var(--c) 12%,var(--paper)); font-weight:600}
.sent-pick input:focus-visible + span{outline:2px solid var(--steel)}
.qli{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin:4px 0}
.qli > span{flex:1; min-width:0}
.qdel{flex:none; display:inline-flex; align-items:center; gap:4px; border:1px solid color-mix(in srgb,var(--brick) 35%,var(--line)); background:transparent; color:var(--brick); border-radius:6px; padding:2px 8px; font-size:12px; font-weight:500; cursor:pointer; line-height:1.6}
.qdel:hover{background:color-mix(in srgb,var(--brick) 10%,transparent); border-color:var(--brick)}
.qdel:focus-visible{outline:2px solid var(--brick); outline-offset:1px}
.modal-scrim{position:fixed; inset:0; background:rgba(10,14,12,.45); z-index:60; display:grid; place-items:center; padding:20px}
.modal{background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:14px; padding:20px 22px; width:min(440px,100%); box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal p{margin:0 0 18px; white-space:pre-line; font-size:15px; line-height:1.5}
.modal .actions{justify-content:flex-end}
.btn.danger-solid{background:var(--brick); border-color:var(--brick); color:#fff}
.btn.danger-solid:hover{opacity:.9}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--surface)}
.seg button{all:unset; cursor:pointer; padding:7px 12px; font-size:13.5px; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink); color:var(--paper)}
.seg button:focus-visible{outline:2px solid var(--steel); outline-offset:-2px}
.jd-group{background:var(--surface); border:1px solid var(--line); border-radius:12px; margin-bottom:16px; overflow:hidden}
.jd-group .tbl-wrap{padding:0 10px 6px}
.jd-group table{table-layout:fixed; min-width:560px}
.jd-group th:nth-child(1){width:24%}
.jd-group th:nth-child(2){width:11%}
.jd-group th:nth-child(6){width:15%}
.jd-gh{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; padding:16px 18px 12px; flex-wrap:wrap; border-left:4px solid var(--steel)}
.jd-gt h2{font-size:19px; line-height:1.2}
.linkish.plain{color:inherit; text-decoration:none}
.linkish.plain:hover{text-decoration:underline}
.jd-gm{color:var(--muted); font-size:13.5px; margin-top:3px; display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.jd-gm b{color:var(--ink); font-weight:600}
.jd-stats{display:flex; gap:14px; flex-wrap:wrap; font-size:13px; color:var(--muted); margin-top:8px}
.jd-stats b{color:var(--ink); font-family:var(--display); font-size:15px}
.jd-stats .need b{color:var(--brick)}
.jd-empty{padding:4px 18px 16px}
.hint-box{background:var(--surface); border:1px dashed var(--line); border-radius:12px; padding:14px 18px; margin-bottom:16px; display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap; color:var(--muted)}
.qjd{border-left:3px solid var(--line); padding:4px 0 8px 14px; margin:0 0 16px}
.qjd-h{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px}
.qjd-h b{font-weight:600; font-size:15px}
.qjd-h small{display:block; color:var(--muted); font-size:12.5px}
.qjd-h .pill{margin-left:4px; font-size:11.5px; padding:1px 8px}
.sm-x{width:24px; height:24px; font-size:16px}
.src-box{background:color-mix(in srgb,var(--steel) 5%,var(--surface)); border:1px solid color-mix(in srgb,var(--steel) 30%,var(--line)); border-radius:12px; padding:12px; gap:10px}
.src-tabs{display:flex; gap:4px}
.src-tabs button{all:unset; cursor:pointer; padding:6px 12px; border-radius:7px; font-size:13.5px; font-weight:500; color:var(--muted)}
.src-tabs button[aria-selected="true"]{background:var(--surface); color:var(--ink); box-shadow:0 0 0 1px var(--line)}
.src-tabs button:focus-visible{outline:2px solid var(--steel)}
.extract-status{font-size:13.5px; min-height:0}
.extract-status:empty{display:none}
.ok-text{color:var(--leaf); font-weight:600}
.warn-text{color:var(--brick)}
.spin{display:inline-block; width:12px; height:12px; border:2px solid var(--line); border-top-color:var(--steel); border-radius:50%; animation:sp .8s linear infinite; vertical-align:-1px; margin-right:4px}
@keyframes sp{to{transform:rotate(360deg)}}
.fld input.just-filled,.fld textarea.just-filled,.fld select.just-filled{border-color:var(--leaf); background:color-mix(in srgb,var(--leaf) 8%,var(--paper)); transition:background .6s}
.pdf-mark{display:inline-block; font-size:10.5px; font-weight:700; color:var(--brick); border:1px solid currentColor; border-radius:4px; padding:0 4px; margin-left:6px; vertical-align:1px}
.toast{position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:.2s; z-index:40; pointer-events:none; max-width:90vw}
.toast.on{opacity:1; transform:translateX(-50%)}
.muted{color:var(--muted)}
.loading{display:grid; place-items:center; min-height:50vh; color:var(--muted)}
@media (max-width:980px){
  .reading{grid-template-columns:1fr}
  .kpis{border-left:0; padding-left:0; border-top:1px solid color-mix(in srgb,var(--paper) 22%,transparent); padding-top:20px; grid-template-columns:repeat(3,1fr)}
  .grid-dash,.grid2,.grid3,.grid-dash.qb{grid-template-columns:1fr}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky; top:0; height:auto; z-index:10; flex-direction:row; align-items:center; padding:10px 12px; gap:10px; border-right:0; border-bottom:1px solid var(--line); overflow-x:auto; top:env(safe-area-inset-top,0px)}
  .brand small,.rail-foot{display:none}
  .brand{flex-direction:row; align-items:center; gap:8px; padding:0}
  .logo{height:20px}
  .brand-sub b{font-size:14px; white-space:nowrap}
  .brand b{font-size:16px}
  .nav{flex-direction:row}
  .nav .count{display:none}
  .nav button{padding:7px 10px; white-space:nowrap}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--ink)}
  .kpis{grid-template-columns:1fr 1fr}
  .facts{grid-template-columns:1fr 1fr}
  form.f{grid-template-columns:1fr}
  .reading{padding:20px}
  .frow{grid-template-columns:86px 1fr 40px}
  .fconv{padding-left:98px}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
/* ===== Sedin theme ===== */
.app{background:linear-gradient(to right, var(--rail) 0 232px, transparent 232px)}
:root{
  --paper:#F4F5F9; --surface:#FFFFFF; --ink:#0F1222; --muted:#646B82; --line:#E3E6EE; --soft:#EEF0F6;
  --brand:#0B1AF5; --brand-ink:#FFFFFF;
  --steel:#2F5BEA; --gold:#0E9F6E; --brick:#E5484D; --plum:#7A5AF8; --leaf:#0B8C88; --grey:#8A90A2;
  --rail:#0D0F1E; --rail-ink:#E9EBF5; --rail-muted:#8F94AD;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
  --display:"Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --body:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0B0D18; --surface:#141728; --ink:#E8EAF2; --muted:#9AA0B5; --line:#262A40; --soft:#1C2034;
    --brand:#5865FF; --steel:#7E97FF; --gold:#34D399; --brick:#FF7A7F; --plum:#A78BFA; --leaf:#2DD4BF; --grey:#9097AB;
    --rail:#070912; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#0B0D18; --surface:#141728; --ink:#E8EAF2; --muted:#9AA0B5; --line:#262A40; --soft:#1C2034;
  --brand:#5865FF; --steel:#7E97FF; --gold:#34D399; --brick:#FF7A7F; --plum:#A78BFA; --leaf:#2DD4BF; --grey:#9097AB;
  --rail:#070912; --shadow:none;
}
body{font-size:14.5px}
h1,h2,h3{letter-spacing:-0.02em}
:focus-visible{outline-color:var(--brand)}
a{color:var(--brand)}
/* rail */
.rail{background:var(--rail); color:var(--rail-ink); border-right:0; padding:24px 14px}
.rail .logo-l{display:none !important} .rail .logo-d{display:block !important}
.brand-sub b{color:#fff; font-size:15px; font-weight:700}
.brand-sub small{color:var(--rail-muted)}
.nav button{color:var(--rail-muted); border-radius:10px; padding:10px 12px; font-weight:500}
.nav button:hover{background:rgba(255,255,255,.06); color:#fff}
.nav button[aria-current="page"]{background:var(--brand); color:#fff; box-shadow:0 6px 18px -6px color-mix(in srgb,var(--brand) 70%,transparent)}
.nav .count{color:inherit; opacity:.75; font-size:11.5px; background:rgba(255,255,255,.08); border-radius:999px; padding:1px 8px}
.nav button[aria-current="page"] .count{background:rgba(255,255,255,.2); opacity:1}
.nav .count:empty{display:none}
.rail-foot{color:var(--rail-muted)}
.rail-foot .linkish{color:#C9CDF9}
.rail .dot{background:#34D399}
/* surfaces */
.panel{border-radius:16px; border-color:var(--line); box-shadow:var(--shadow); padding:20px 22px}
.panel h2{font-size:16px; font-weight:700}
.panel .sub{font-size:12.5px}
.btn{border-radius:10px; font-weight:600; font-size:13.5px}
.btn.primary{background:var(--brand); border-color:var(--brand); color:#fff}
.btn.primary:hover{opacity:1; filter:brightness(1.08)}
select.ctl,input.ctl{border-radius:10px}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--brand); border-color:var(--brand); color:#fff}
.chip[aria-pressed="true"] b{color:#fff}
th{text-transform:uppercase; letter-spacing:.04em; font-size:11px; font-weight:600}
.jd-gh{border-left-color:var(--brand)}
.emp{color:var(--brand); background:color-mix(in srgb,var(--brand) 10%,transparent)}
.drawer{border-radius:18px 0 0 18px}
.drawer.on{box-shadow:-20px 0 50px rgba(15,18,34,.12)}
.inline-form{border-color:color-mix(in srgb,var(--brand) 45%,var(--line)); background:color-mix(in srgb,var(--brand) 4%,var(--surface))}
.src-box{background:color-mix(in srgb,var(--brand) 4%,var(--surface)); border-color:color-mix(in srgb,var(--brand) 25%,var(--line))}
.hb .t span{background:var(--c,var(--brick))}
.ratio .mini span{background:var(--gold)}
.page-head h1{font-size:clamp(24px,2.6vw,30px); font-weight:800}
/* dashboard */
.dash-head .eyebrow{margin:0 0 4px; color:var(--brand); font-size:12.5px; font-weight:600; letter-spacing:.01em}
.dash-head p b{color:var(--ink)}
.kgrid{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:14px; margin-bottom:18px}
.kcard{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px; box-shadow:var(--shadow); position:relative; overflow:hidden}
.kcard::after{content:""; position:absolute; inset:auto 0 0 0; height:3px; background:var(--c)}
.kc-top{display:flex; align-items:center; gap:8px}
.kc-ico{width:32px; height:32px; border-radius:10px; display:grid; place-items:center; color:var(--c); background:color-mix(in srgb,var(--c) 12%,transparent); flex:none}
.kc-l{font-size:12.5px; color:var(--muted); font-weight:600; line-height:1.25}
.kc-n{font-family:var(--display); font-size:30px; font-weight:800; letter-spacing:-.03em; margin:12px 0 4px; line-height:1}
.kc-n small{font-size:14px; font-weight:600; color:var(--muted); letter-spacing:0}
.kc-f{font-size:11.5px; color:var(--muted); line-height:1.4}
.trend{font-weight:700; color:var(--muted)}
.trend.up{color:var(--gold)} .trend.down{color:var(--brick)}
.dgrid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px}
.dgrid > *{min-width:0}
.span2{grid-column:span 2} .span3{grid-column:1/-1}
.ph{display:flex; gap:12px; align-items:flex-start; margin-bottom:12px}
.ph .sub{margin:2px 0 0}
.ph-ico{width:36px; height:36px; border-radius:12px; display:grid; place-items:center; background:var(--brand); color:#fff; flex:none}
.ph-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
.count-badge{background:color-mix(in srgb,var(--brand) 12%,transparent); color:var(--brand); font-weight:700; font-size:12px; border-radius:999px; padding:2px 10px}
.insight{background:linear-gradient(135deg, color-mix(in srgb,var(--brand) 7%,var(--surface)) 0%, var(--surface) 55%)}
.ins{list-style:none; margin:0; padding:0; display:grid; grid-template-columns:1fr 1fr; gap:10px}
.ins li{display:flex; gap:10px; align-items:flex-start; padding:12px 14px; background:var(--surface); border:1px solid var(--line); border-radius:12px; font-size:13.5px; line-height:1.45}
.ins li::before{content:""; width:8px; height:8px; border-radius:50%; background:var(--mk); margin-top:6px; flex:none}
.ins li b{font-weight:700}
.funnel2{display:flex; flex-direction:column; gap:8px; margin-top:6px}
.f2{display:grid; grid-template-columns:1fr 44px; gap:8px; align-items:center}
.f2-bar{width:var(--w); min-width:fit-content; background:var(--c); color:#fff; border-radius:10px; padding:8px 12px; display:flex; justify-content:space-between; gap:12px; font-size:13px; font-weight:600; transition:width .5s}
.f2-bar b{font-family:var(--display); font-size:15px}
.f2 em{font-style:normal; font-size:12px; color:var(--muted); text-align:right; font-weight:600}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .f2-bar{color:#0B0D18} }
:root[data-theme="dark"] .f2-bar{color:#0B0D18}
.rej-split{margin-top:18px; padding-top:14px; border-top:1px solid var(--line)}
.rs-h{display:flex; justify-content:space-between; font-size:13px; font-weight:600}
.cav{display:inline-grid; place-items:center; width:26px; height:26px; border-radius:8px; background:color-mix(in srgb,var(--brand) 12%,transparent); color:var(--brand); font-weight:700; font-size:12px; margin-right:10px; vertical-align:middle}
.ratio b{min-width:38px; display:inline-block}
.fb-mini .panel{margin-top:0 !important; height:100%}
.fb-mini .fb-list .fb:nth-child(n+3){display:none}
.data-panel{margin-top:18px}
@media (max-width:1180px){ .kgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:980px){ .dgrid{grid-template-columns:1fr} .span2,.span3{grid-column:auto} .ins{grid-template-columns:1fr} }
@media (max-width:760px){
  .kgrid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
  .kc-n{font-size:26px}
  .rail{padding:10px 12px}
  .drawer{border-radius:0}
  .app{background:none; grid-template-rows:auto 1fr}
}

</style>

async function copyText(txt, msg){
  try { await navigator.clipboard.writeText(txt); toast(msg); return; } catch(e){}
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); toast(msg); } catch(e){ toast('Couldn’t copy — select the text and copy it manually.'); } ta.remove();
}
function showNotice(html, url, label){
  let n = $('#notice'); if (!n) { n = document.createElement('div'); n.id='notice'; n.className='notice'; n.setAttribute('role','status'); document.body.appendChild(n); }
  n.innerHTML = `<span>${html}</span>${url?`<a class="btn sm primary" href="${esc(url)}" target="_blank" rel="noopener">${label||'Open'}</a>`:''}<button class="x" aria-label="Dismiss" onclick="this.parentNode.remove()">×</button>`;
}
function askConfirm(msg, okLabel){
  return new Promise(resolve => {
    const prev = document.activeElement;
    const m = document.createElement('div'); m.className = 'modal-scrim';
    m.innerHTML = `<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="mdl-t"><p id="mdl-t"></p><div class="actions"><button type="button" class="btn" data-m="no">Cancel</button><button type="button" class="btn danger-solid" data-m="yes">${esc(okLabel||'Delete')}</button></div></div>`;
    m.querySelector('p').textContent = msg;
    document.body.appendChild(m);
    const done = v => { m.remove(); document.removeEventListener('keydown', kd, true); if (prev && prev.focus) prev.focus(); resolve(v); };
    const kd = e => { if (e.key==='Escape') { e.stopPropagation(); e.preventDefault(); done(false); } else if (e.key==='Tab') { const b=[...m.querySelectorAll('button')]; const i=b.indexOf(document.activeElement); e.preventDefault(); b[(i+(e.shiftKey?-1:1)+b.length)%b.length].focus(); } };
    document.addEventListener('keydown', kd, true);
    m.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('[data-m]'); if (b) done(b.dataset.m==='yes'); else if (e.target===m) done(false); });
    setTimeout(() => m.querySelector('[data-m="yes"]').focus(), 0);
  });
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('on'),2600); }

function lastActivity(s){
  let d = s.sharedDate || '';
  (s.history||[]).forEach(h => { if(h.at > d) d = h.at; });
  (s.rounds||[]).forEach(r => { if(r.date && r.date > d) d = r.date; });
  return d;
}

const LS_KEY = 'talentdesk-v1';
/* Google Apps Script backend (when served from a Google Apps Script web app) */
const GAS_ON = typeof google !== 'undefined' && google.script && google.script.run;
function gas(fn, ...args){ return new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn](...args)); }
const SHARED = () => Store.mode==='db' || Store.mode==='gas' || Store.mode==='server';
async function api(method, path, body, raw){
  const r = await fetch(path, {method, headers: raw ? {} : {'Content-Type':'application/json'}, body: raw ? body : body!=null ? JSON.stringify(body) : undefined, cache:'no-store'});
  const j = await r.json().catch(()=>({}));
  if (!r.ok) throw new Error(j.error || ('Server error ' + r.status));
  return j;
}
async function probeServer(){
  if (!/^https?:$/.test(location.protocol) || /claude\.ai$|claudeusercontent\.com$|googleusercontent\.com$/.test(location.hostname)) return false;
  try { const ctl = new AbortController(); setTimeout(()=>ctl.abort(), 2500); const r = await fetch('api/ping', {cache:'no-store', signal:ctl.signal}); if (!r.ok) return false; const j = await r.json(); return j && j.app==='talent-desk'; } catch(e){ return false; }
}
const Store = {
  mode:'loading', db:null, data:{submissions:[], jds:[]}, ready:{submissions:false, jds:false},
  pending:0, lastSig:'',
  async refresh(){
    if (this.pending) return;
    if (this.mode==='server') {
      try {
        const v = await api('GET','api/version');
        if (this.pending || (this.lastSig && String(v.version)===this.lastSig)) { this.offline && (this.offline=false, renderNav()); return; }
        const r = await api('GET','api/all'); if (this.pending) return;
        this.lastSig = String(r.version); this.offline=false;
        this.data = {submissions: r.submissions||[], jds: r.jds||[]};
        this.ready = {submissions:true, jds:true}; onData();
      } catch(e){ if (!this.ready.jds){ this.ready={submissions:true,jds:true}; onData(); } if (!this.offline){ this.offline=true; renderNav(); toast('Can’t reach the Sedin Talent Desk computer — check it’s switched on and the program is running.'); } }
      return;
    }
    try {
      const raw = await gas('listAll');
      if (this.pending || raw === this.lastSig) return;
      this.lastSig = raw; const r = JSON.parse(raw);
      this.data = {submissions: r.submissions||[], jds: r.jds||[]};
      this.ready = {submissions:true, jds:true}; onData();
    } catch(e){ if (!this.ready.jds){ this.ready={submissions:true,jds:true}; onData(); } toast('Couldn’t reach the shared sheet: ' + (e && e.message || e)); }
  },
  async gasWrite(fn, ...args){
    this.pending++;
    try {
      if (this.mode==='server') {
        const [col, id, json] = args;
        if (fn==='putRecord') await api('PUT', `api/${col}/${id}`, JSON.parse(json));
        else if (fn==='patchRecord') await api('PATCH', `api/${col}/${id}`, JSON.parse(json));
        else if (fn==='removeRecord') await api('DELETE', `api/${col}/${id}`);
      } else await gas(fn, ...args);
    }
    catch(e){ toast('Couldn’t save: ' + (e && e.message || e)); this.pending--; this.lastSig=''; await this.refresh(); throw e; }
    this.pending--; if (!this.pending) { this.lastSig=''; setTimeout(()=>this.refresh(), 300); }
  },
  async init(){
    if (await probeServer()) {
      this.mode = 'server';
      await this.refresh();
      setInterval(() => { if (!document.hidden) this.refresh(); }, 4000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) this.refresh(); });
      return;
    }
    if (GAS_ON) {
      this.mode = 'gas';
      await this.refresh();
      setInterval(() => { if (!document.hidden) this.refresh(); }, 15000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) this.refresh(); });
      return;
    }
    let db = null;
    try { if (window.claude && typeof window.claude.use === 'function') db = await window.claude.use('db'); } catch(e){ db = null; }
    if (db) {
      this.mode = 'db'; this.db = db;
      ['submissions','jds'].forEach(col => {
        db.collection(col).onSnapshot(snap => {
          this.data[col] = snap.docs.map(d => ({ id:d.id, ...clone(d.data()) }));
          this.ready[col] = true; onData();
        }, err => {
          if (err.code === 'revoked') toast('This page can no longer reach saved data.');
          else toast('Sync issue: ' + (err.message||err.code));
          this.ready[col] = true; onData();
        });
      });
    } else {
      this.mode = 'local';
      try { const raw = localStorage.getItem(LS_KEY); if (raw) this.data = Object.assign({submissions:[],jds:[]}, JSON.parse(raw)); } catch(e){}
      this.ready = {submissions:true, jds:true}; onData();
    }
  },
  persist(){ try { localStorage.setItem(LS_KEY, JSON.stringify(this.data)); } catch(e){ toast('This browser’s storage is full — download a backup and remove old records.'); } onData(); },
  async write(fn){
    try { return await fn(); }
    catch(e){
      if (e && e.code === 'unavailable') { await new Promise(r=>setTimeout(r, 400+Math.random()*600)); return await fn(); }
      if (e && e.code === 'quota_exceeded') toast('Storage is full — delete some old records to add more.');
      else if (e && e.code === 'invalid_argument') toast('You have view-only access, so changes can’t be saved.');
      else toast('Couldn’t save: ' + (e && (e.message||e.code) || 'unknown error'));
      throw e;
    }
  },
  async add(col, obj){
    const id = uid(); const body = {...obj, createdAt:nowISO(), updatedAt:nowISO()};
    if (this.mode === 'db') await this.write(() => this.db.collection(col).doc(id).set(body));
    else if (this.mode === 'gas' || this.mode === 'server') { this.data[col].push({id, ...body}); onData(); await this.gasWrite('putRecord', col, id, JSON.stringify(body)); }
    else { this.data[col].push({id, ...body}); this.persist(); }
    return id;
  },
  async update(col, id, patch){
    const body = {...patch, updatedAt:nowISO()};
    if (this.mode === 'db') await this.write(() => this.db.collection(col).doc(id).update(body));
    else if (this.mode === 'gas' || this.mode === 'server') { const i = this.data[col].findIndex(x => x.id===id); if (i>-1) this.data[col][i] = {...this.data[col][i], ...body}; onData(); await this.gasWrite('patchRecord', col, id, JSON.stringify(body)); }
    else { const i = this.data[col].findIndex(x => x.id===id); if (i>-1) this.data[col][i] = {...this.data[col][i], ...body}; this.persist(); }
  },
  async remove(col, id){
    if (this.mode === 'db') await this.write(() => this.db.collection(col).doc(id).delete());
    else if (this.mode === 'gas' || this.mode === 'server') { this.data[col] = this.data[col].filter(x => x.id!==id); onData(); await this.gasWrite('removeRecord', col, id); }
    else { this.data[col] = this.data[col].filter(x => x.id!==id); this.persist(); }
  }
};

/* ---------- metrics ---------- */
function inRange(s){
  if (state.range==='all') return true;
  const n = +state.range; return s.sharedDate && dayDiff(s.sharedDate, today()) <= n;
}
function clients(){ return [...new Set([...subs().map(s=>s.client), ...jds().map(j=>j.client)].filter(Boolean))].sort(); }
function compute(list){
  const m = {total:list.length, by:{}, interviewed:0, selected:0, joined:0, rejected:0, screenRej:0, intRej:0, active:0, decisionDays:[]};
  STATUSES.forEach(s => m.by[s]=0);
  list.forEach(s => {
    m.by[s.status] = (m.by[s.status]||0)+1;
    const hadRounds = (s.rounds||[]).length>0;
    if (hadRounds || ['Interviewing','Selected','Joined'].includes(s.status)) m.interviewed++;
    if (DECIDED_OK.includes(s.status)) m.selected++;
    if (s.status==='Joined') m.joined++;
    if (s.status==='Rejected'){ m.rejected++; hadRounds ? m.intRej++ : m.screenRej++; }
    if (ACTIVE.includes(s.status)) m.active++;
    if (s.decisionDate && s.sharedDate) m.decisionDays.push(Math.max(0, dayDiff(s.sharedDate, s.decisionDate)));
  });
  m.avgDecision = m.decisionDays.length ? Math.round(m.decisionDays.reduce((a,b)=>a+b,0)/m.decisionDays.length) : null;
  return m;
}
function byClient(list){
  const g = {};
  list.forEach(s => { const k = s.client||'Unassigned'; (g[k] ||= []).push(s); });
  return Object.entries(g).map(([client, arr]) => ({client, ...compute(arr)})).sort((a,b)=>b.total-a.total);
}
function staleList(){
  return subs().filter(s => ACTIVE.includes(s.status)).map(s => ({s, idle: dayDiff(lastActivity(s), today())}))
    .filter(x => x.idle >= 5).sort((a,b)=>b.idle-a.idle);
}
function allQuestions(){
  const out = [];
  subs().forEach(s => (s.rounds||[]).forEach(r => {
    (r.questions||[]).forEach(q => { if (q && q.trim()) out.push({q:q.trim(), client:s.client||'Unassigned', role:s.role, jdId:s.jdId, candidate:s.candidate, round:r.name, date:r.date, outcome:r.outcome, topics:r.topics||[], subId:s.id, source:'round'}); });
  }));
  jds().forEach(j => (j.questions||[]).forEach(x => { if (x && x.q) out.push({q:x.q, client:j.client||'Unassigned', role:j.title, jdId:j.id, candidate:'', round:x.round||'', date:x.at, topics:x.topic?x.topic.split(',').map(t=>t.trim()).filter(Boolean):[], source:'jd', qid:x.id}); }));
  return out;
}
const normQ = q => q.toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim();

function insights(list, m){
  const out = [];
  const cl = byClient(list).filter(c => c.client!=='Unassigned');
  const eligible = cl.filter(c => c.total >= 3);
  if (m.total === 0) return [{t:'No profiles shared in this period yet.', c:'--grey'}];
  out.push({t:`<b>${m.selected} of ${m.total}</b> profiles shared ${state.range==='all'?'so far':'in this period'} were selected — a hit ratio of <b>${pct(m.selected,m.total)}%</b>.`, c:'--gold'});
  if (eligible.length >= 2){
    const s = [...eligible].sort((a,b)=> b.selected/b.total - a.selected/a.total);
    const best = s[0], worst = s[s.length-1];
    if (best.selected/best.total > worst.selected/worst.total)
      out.push({t:`<b>${esc(best.client)}</b> converts best (${pct(best.selected,best.total)}%). <b>${esc(worst.client)}</b> trails at ${pct(worst.selected,worst.total)}% — worth a call to recalibrate what they want.`, c:'--leaf'});
  }
  if (m.rejected >= 2){
    if (m.screenRej > m.intRej) out.push({t:`<b>${pct(m.screenRej,m.rejected)}%</b> of rejections happen before any interview — the profiles aren’t matching the JD on paper. Tighten screening.`, c:'--brick'});
    else out.push({t:`<b>${pct(m.intRej,m.rejected)}%</b> of rejections come after an interview — prep candidates with the question bank before their rounds.`, c:'--brick'});
  }
  const reasons = {}; list.filter(s=>s.status==='Rejected'&&s.rejectionReason).forEach(s=>reasons[s.rejectionReason]=(reasons[s.rejectionReason]||0)+1);
  const topR = Object.entries(reasons).sort((a,b)=>b[1]-a[1])[0];
  if (topR && topR[1]>=2) out.push({t:`The most common rejection reason is <b>${esc(topR[0].toLowerCase())}</b> (${topR[1]} of ${m.rejected}).`, c:'--brick'});
  if (m.avgDecision != null){
    const slow = cl.filter(c=>c.avgDecision!=null && c.decisionDays.length>=2).sort((a,b)=>b.avgDecision-a.avgDecision)[0];
    out.push({t:`Clients take <b>${m.avgDecision} days</b> on average to decide${slow && slow.avgDecision>m.avgDecision ? `; <b>${esc(slow.client)}</b> is slowest at ${slow.avgDecision} days` : ''}.`, c:'--steel'});
  }
  const stale = staleList();
  if (stale.length) out.push({t:`<b>${plural(stale.length,'profile')}</b> ${stale.length===1?'has':'have'} had no update for 5+ days — follow up with the client.`, c:'--plum'});
  const tc = {}; allQuestions().forEach(q => q.topics.forEach(t => { const k=t.trim(); if(k) tc[k]=(tc[k]||0)+1; }));
  const topT = Object.entries(tc).sort((a,b)=>b[1]-a[1])[0];
  if (topT && topT[1] >= 3) out.push({t:`<b>${esc(topT[0])}</b> is the most-probed topic across interviews (${topT[1]} questions).`, c:'--plum'});
  return out.slice(0,6);
}

function greeting(){ const h=new Date().getHours(); return h<12?'Good morning':h<17?'Good afternoon':'Good evening'; }
function trend(field, test){
  const scope = subs().filter(s => !state.dashClient || s.client===state.dashClient);
  const inWin = (d, a, b) => d && dayDiff(d, today()) >= a && dayDiff(d, today()) < b;
  const cur = scope.filter(s => test(s) && inWin(s[field], 0, 30)).length, prev = scope.filter(s => test(s) && inWin(s[field], 30, 60)).length;
  const d = cur - prev;
  return `<span class="trend ${d>0?'up':d<0?'down':''}">${d>0?'▲ '+d:d<0?'▼ '+Math.abs(d):'— 0'}</span> vs previous 30 days`;
}
function kcard(icon, color, value, label, foot){
  return `<div class="kcard" style="--c:var(${color})"><div class="kc-top"><span class="kc-ico">${ico(icon)}</span><span class="kc-l">${label}</span></div><div class="kc-n">${value}</div><div class="kc-f">${foot}</div></div>`;
}
function viewDashboard(){
  const cls = clients();
  if (!subs().length && !jds().length) return pageHead('Dashboard','How your submissions are landing with clients.') + emptyDesk();
  const list = subs().filter(inRange).filter(s => !state.dashClient || s.client===state.dashClient);
  const m = compute(list);
  const ins = insights(list, m);
  const head = `<div class="page-head dash-head"><div><p class="eyebrow">${greeting()} · ${new Date().toLocaleDateString(undefined,{weekday:'long', day:'numeric', month:'long'})}</p><h1>Dashboard</h1><p>${state.dashClient?`How your submissions are landing with <b>${esc(state.dashClient)}</b>.`:'How your submissions are landing with clients.'}</p></div>
    <div class="actions"><select class="ctl" data-filter="dashClient" aria-label="Client"><option value="">All clients</option>${cls.map(c=>`<option ${state.dashClient===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
    <select class="ctl" data-filter="range" aria-label="Period">${[['all','All time'],['30','Last 30 days'],['90','Last 90 days'],['180','Last 6 months']].map(([v,l])=>`<option value="${v}" ${state.range===v?'selected':''}>${l}</option>`).join('')}</select>
    <button class="btn primary" data-action="new-sub">+ Log a shared profile</button></div></div>`;

  const kpis = `<section class="kgrid" aria-label="Key numbers">
    ${kcard('send','--steel', m.total, 'Profiles shared', trend('sharedDate', ()=>true))}
    ${kcard('play','--plum', m.active, 'Still in play', `${pct(m.active,m.total)}% of shared profiles`)}
    ${kcard('chat','--brand', m.interviewed, 'Got interviews', `${pct(m.interviewed,m.total)}% interview rate`)}
    ${kcard('check','--gold', m.selected, 'Selected', `<b>${pct(m.selected,m.total)}%</b> hit ratio · ${trend('decisionDate', s=>DECIDED_OK.includes(s.status)).replace(' vs previous 30 days','')}`)}
    ${kcard('x','--brick', m.rejected, 'Rejected', trend('decisionDate', s=>s.status==='Rejected'))}
    ${kcard('clock','--grey', m.avgDecision==null?'—':m.avgDecision+'<small> days</small>', 'Avg time to decision', 'From profile shared to client decision')}
  </section>`;

  const insightsP = `<div class="panel insight span2"><div class="ph"><span class="ph-ico">${ico('spark')}</span><div><h2>Insights</h2><p class="sub">What your numbers are saying right now.</p></div></div>
    <ul class="ins">${ins.map(i=>`<li style="--mk:var(${i.c})"><span>${i.t}</span></li>`).join('')}</ul></div>`;

  const stages = [['Shared',m.total,'--steel'],['Interviewed',m.interviewed,'--plum'],['Selected',m.selected,'--gold'],['Joined',m.joined,'--leaf']];
  const max = Math.max(1,m.total);
  const funnel = `<div class="panel"><h2>Pipeline funnel</h2><p class="sub">How far profiles get.</p><div class="funnel2">
    ${stages.map(([l,n,c],i)=>`<div class="f2" style="--c:var(${c}); --w:${Math.max(n/max*100, 6)}%"><div class="f2-bar"><span>${l}</span><b>${n}</b></div>${i?`<em>${pct(n,stages[i-1][1])}%</em>`:'<em>&nbsp;</em>'}</div>`).join('')}
    </div>
    <div class="rej-split"><div class="rs-h"><span>Where rejections happen</span><b>${m.rejected}</b></div>
      <div class="split"><span style="width:${pct(m.screenRej,m.rejected)}%;background:var(--brick)"></span><span style="width:${pct(m.intRej,m.rejected)}%;background:color-mix(in srgb,var(--brick) 40%,var(--soft))"></span></div>
      <div class="legend"><span><i style="background:var(--brick)"></i>On profile · ${m.screenRej}</span><span><i style="background:color-mix(in srgb,var(--brick) 40%,var(--soft))"></i>After interview · ${m.intRej}</span></div></div></div>`;

  const cl = byClient(list);
  const clientTbl = `<div class="panel span3"><div class="ph-row"><div><h2>Client scorecard</h2><p class="sub">Hit ratio = selected ÷ profiles shared. Click a client to see their profiles.</p></div></div>
    ${cl.length?`<div class="tbl-wrap"><table><thead><tr><th>Client</th><th class="num">Shared</th><th class="num hide-sm">Interviewed</th><th class="num">Selected</th><th class="num hide-sm">Rejected</th><th class="num">Hit ratio</th><th class="num hide-sm">Avg days to decide</th></tr></thead><tbody>
    ${cl.map(c=>`<tr class="click" data-goto-client="${esc(c.client)}"><td><span class="cav">${esc((c.client||'?').trim().charAt(0).toUpperCase())}</span><b>${esc(c.client)}</b></td><td class="num">${c.total}</td><td class="num hide-sm">${c.interviewed}</td><td class="num">${c.selected}</td><td class="num hide-sm">${c.rejected}</td><td class="num"><div class="ratio"><div class="mini"><span style="width:${pct(c.selected,c.total)}%"></span></div><b>${pct(c.selected,c.total)}%</b></div></td><td class="num hide-sm">${c.avgDecision??'—'}</td></tr>`).join('')}
    </tbody></table></div>`:'<p class="empty-note">No profiles in this period.</p>'}</div>`;

  const reasons = {}; list.filter(s=>s.status==='Rejected').forEach(s=>{ const r=s.rejectionReason||'Not recorded'; reasons[r]=(reasons[r]||0)+1; });
  const rr = Object.entries(reasons).sort((a,b)=>b[1]-a[1]); const rmax = Math.max(1,...rr.map(r=>r[1]));
  const reasonsP = `<div class="panel"><h2>Why profiles get rejected</h2><p class="sub">Reasons logged against rejections.</p>
    ${rr.length?`<div class="hbars">${rr.map(([r,n])=>`<div class="hb"><span>${esc(r)}</span><div class="t"><span style="width:${n/rmax*100}%"></span></div><span class="v">${n}</span></div>`).join('')}</div>`:'<p class="empty-note">No rejections logged. Nice.</p>'}</div>`;

  const stale = staleList();
  const staleP = `<div class="panel"><div class="ph-row"><div><h2>Needs a follow-up</h2><p class="sub">No update for 5+ days.</p></div>${stale.length?`<span class="count-badge">${stale.length}</span>`:''}</div>
    ${stale.length?`<div class="list">${stale.slice(0,6).map(({s,idle})=>`<div class="li" data-open-sub="${s.id}"><div class="who"><b>${esc(s.candidate)} ${empTag(s)}</b><small>${esc(s.client||'')} · ${esc(s.role||'')}</small></div><div style="text-align:right">${pill(s.status)}<div class="age warn" style="font-size:12px">${idle} days idle</div></div></div>`).join('')}</div>`:'<p class="empty-note">Everything active has moved in the last 5 days.</p>'}</div>`;

  const open = jds().filter(j=>(j.status||'Open')==='Open' && (!state.dashClient || j.client===state.dashClient)).map(j=>{ const a=subs().filter(s=>s.jdId===j.id); return {j, n:a.length, sel:a.filter(s=>DECIDED_OK.includes(s.status)).length, age:dayDiff(j.receivedDate||today(),today())}; }).sort((a,b)=>a.n-b.n || b.age-a.age);
  const jdP = `<div class="panel"><div class="ph-row"><div><h2>Open JD coverage</h2><p class="sub">Fewest profiles shared first.</p></div>${open.length?`<span class="count-badge">${open.length}</span>`:''}</div>
    ${open.length?`<div class="list">${open.slice(0,6).map(o=>`<div class="li" data-open-jd="${o.j.id}"><div class="who"><b>${esc(o.j.title)}</b><small>${esc(o.j.client)} · open ${o.age}d · ${o.j.openings||1} opening${(o.j.openings||1)==1?'':'s'}</small></div><div style="text-align:right;font-size:13px">${o.n===0?`<span class="age warn">No profiles yet</span>`:`<b>${o.n}</b> <span class="muted">shared</span><br><span class="muted">${o.sel} selected</span>`}</div></div>`).join('')}</div>`:'<p class="empty-note">No open JDs.</p>'}</div>`;

  return head + kpis + `<div class="dgrid">
    ${insightsP}${funnel}
    <div class="panel span2"><h2>Weekly activity</h2><p class="sub">Profiles shared per week, with selections and rejections decided that week.</p>${weekly(list)}</div>${reasonsP}
    ${clientTbl}
    ${staleP}${jdP}<div class="fb-mini">${fbPanel()||`<div class="panel"><h2>Latest feedback</h2><p class="sub">Nothing yet.</p><button class="btn sm" data-nav="feedback">Add feedback</button></div>`}</div>
  </div>${dataPanel()}`;
}

  <div class="fb-list">${fl.slice(0,4).map(x=>fbCard(x,true)).join('')}</div></div>`;
}
function dataPanel(){
  return `<div class="panel data-panel"><div><h2>Your data</h2><p class="sub" style="margin:0">${Store.mode==='server'?'Saved on the office computer running Sedin Talent Desk — everyone on the office network sees the same data, and changes appear within a few seconds. That computer also keeps a daily backup for 30 days.':Store.mode==='gas'?'Saved in your shared Google Sheet — everyone with the link sees the same data, and files are kept in Google Drive. Changes from others appear within about 15 seconds.':Store.mode==='db'?'Saved online and shared with your team. Download a backup to move it into a downloaded copy of this page.':'Saved in this browser only. Download a backup regularly, and use it to move your data to another computer or browser.'}</p></div>
  <div class="actions"><button class="btn sm" data-action="export-csv" ${subs().length?'':'disabled'}>Export CSV</button><button class="btn sm" data-action="backup">Download backup</button><label class="btn sm">Restore backup<input type="file" accept=".json,application/json" hidden data-restore></label></div></div>`;
}
function kpi(n,l){ return `<div class="kpi"><div class="n">${n}</div><div class="l">${l}</div></div>`; }
function pageHead(t,p,actions=''){ return `<div class="page-head"><div><h1>${t}</h1><p>${p}</p></div><div class="actions">${actions}</div></div>`; }

function weekly(list){
  const W = 12, start = new Date(); start.setHours(0,0,0,0); start.setDate(start.getDate() - start.getDay() - (W-1)*7);
  const wk = d => { if(!d) return -1; const x = Math.floor((new Date(d+'T00:00:00') - start)/ (7*86400000)); return x; };
  const shared = Array(W).fill(0), sel = Array(W).fill(0), rej = Array(W).fill(0);
  list.forEach(s => { const a=wk(s.sharedDate); if(a>=0&&a<W) shared[a]++; const b=wk(s.decisionDate); if(b>=0&&b<W){ if(DECIDED_OK.includes(s.status)) sel[b]++; else if(s.status==='Rejected') rej[b]++; } });
  const max = Math.max(2,...shared,...sel.map((v,i)=>v+rej[i]));
  const w=720,h=170,pl=26,pb=24,bw=(w-pl)/W;
  let bars='';
  for(let i=0;i<W;i++){
    const x=pl+i*bw, sh=shared[i]/max*(h-pb-10), dh=(sel[i]+rej[i])/max*(h-pb-10), sH=sel[i]/max*(h-pb-10);
    const d=new Date(start); d.setDate(d.getDate()+i*7);
    bars+=`<rect x="${x+bw*0.14}" y="${h-pb-sh}" width="${bw*0.36}" height="${sh}" rx="3" fill="var(--steel)"><title>${shared[i]} shared</title></rect>`;
    bars+=`<rect x="${x+bw*0.52}" y="${h-pb-dh}" width="${bw*0.3}" height="${dh-sH}" rx="2" fill="var(--brick)" opacity=".8"><title>${rej[i]} rejected</title></rect>`;
    bars+=`<rect x="${x+bw*0.52}" y="${h-pb-sH}" width="${bw*0.3}" height="${sH}" rx="2" fill="var(--gold)"><title>${sel[i]} selected</title></rect>`;
    if(i%2===0||W<=8) bars+=`<text x="${x+bw/2}" y="${h-6}" text-anchor="middle">${d.toLocaleDateString(undefined,{day:'numeric',month:'short'})}</text>`;
  }
  const grid=[0,.5,1].map(f=>{const y=h-pb-f*(h-pb-10);return `<line x1="${pl}" x2="${w}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-dasharray="${f?'3 4':''}"/><text x="${pl-6}" y="${y+4}" text-anchor="end">${Math.round(f*max)}</text>`}).join('');
  return `<div class="tbl-wrap"><svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:520px;display:block" role="img" aria-label="Weekly profiles shared and decisions">${grid}${bars}</svg></div>
  <div class="legend" style="margin-top:8px"><span><i style="background:var(--steel)"></i>Shared</span><span><i style="background:var(--gold)"></i>Selected</span><span><i style="background:var(--brick)"></i>Rejected</span></div>`;
}

function subRow(s, withRole){
  const idle = dayDiff(lastActivity(s), today());
  return `<tr class="click" data-open-sub="${s.id}">${withRole?`<td class="who"><b>${esc(s.client||'—')}</b><small>${esc(s.role||'')}</small></td>`:''}
  <td class="who"><b>${esc(s.candidate)}${s.resume?`<span class="pdf-mark" title="Resume attached">${fileBadge(s.resume)}</span>`:''}</b><small>${s.experience?esc(s.experience)+' yrs':''}${s.notice?` · ${esc(s.notice)}d notice`:''}</small></td>
  <td class="emp-cell">${s.empId?esc(s.empId):'<span class="muted">—</span>'}</td>
  <td class="hide-sm">${fmtDate(s.sharedDate)}</td><td class="hide-sm">${esc(s.sharedBy||'—')}</td><td class="num hide-sm">${(s.rounds||[]).length||'—'}</td>
  <td>${pill(s.status)}${s.status==='Rejected'&&s.rejectionReason?`<br><small class="muted">${esc(s.rejectionReason)}</small>`:''}</td>
  <td class="num age ${ACTIVE.includes(s.status)&&idle>=5?'warn':''}">${idle===0?'Today':idle+'d ago'}</td></tr>`;
}
function subTable(list, withRole){
  return `<div class="tbl-wrap"><table><thead><tr>${withRole?'<th>Client · role</th>':''}<th>Resource</th><th>Emp ID</th><th class="hide-sm">Shared on</th><th class="hide-sm">Shared by</th><th class="num hide-sm">Rounds</th><th>Status</th><th class="num">Last update</th></tr></thead><tbody>${list.map(s=>subRow(s,withRole)).join('')}</tbody></table></div>`;
}
const jdStatusPill = j => pill(j.status||'Open',{Open:'--steel','On hold':'--grey',Closed:'--leaf'});
function viewSubs(){
  const f = state.sf, cls = clients();
  const head = pageHead('Profiles shared','Every resource you’ve sent to a client, grouped by the JD they were shared for.', `<div class="seg" role="group" aria-label="Layout"><button data-action="sub-group" data-g="jd" aria-pressed="${f.group!=='list'}">By JD</button><button data-action="sub-group" data-g="list" aria-pressed="${f.group==='list'}">All in one list</button></div><button class="btn primary" data-action="new-sub">Log a shared profile</button>`);
  if (!subs().length && !jds().length) return head + emptyDesk();
  const q = f.q.toLowerCase();
  const matchQ = s => !q || [s.candidate,s.empId,s.role,s.client,s.skills,s.sharedBy].join(' ').toLowerCase().includes(q);
  const base = subs().filter(s => (!f.client || s.client===f.client) && matchQ(s));
  const counts = {}; base.forEach(s=>counts[s.status]=(counts[s.status]||0)+1);
  const list = base.filter(s => !f.status || s.status===f.status).sort((a,b)=> (b.sharedDate||'').localeCompare(a.sharedDate||''));
  const filters = `<div class="filters"><input class="ctl" type="search" placeholder="Search name, role, skill, JD…" value="${esc(f.q)}" data-sf="q" aria-label="Search">
   <select class="ctl" data-sf="client" aria-label="Client"><option value="">All clients</option>${cls.map(c=>`<option ${f.client===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
   ${f.group!=='list'?`<select class="ctl" data-sf="jdStatus" aria-label="JD status"><option value="active" ${f.jdStatus!=='all'?'selected':''}>Open & on-hold JDs</option><option value="all" ${f.jdStatus==='all'?'selected':''}>All JDs incl. closed</option></select>`:''}</div>
   <div class="chips"><button class="chip" data-status-filter="" aria-pressed="${!f.status}">All<b>${base.length}</b></button>${STATUSES.filter(s=>counts[s]).map(s=>`<button class="chip" data-status-filter="${s}" aria-pressed="${f.status===s}">${s}<b>${counts[s]}</b></button>`).join('')}</div>`;

  if (f.group==='list') return head + filters + `<div class="panel" style="padding:6px 10px">${list.length?subTable(list,true):'<p class="empty-note" style="padding:16px">No profiles match these filters.</p>'}</div>`;

  // grouped by JD
  const narrowing = !!(q || f.status);
  const groups = jds().filter(j => (!f.client || j.client===f.client))
    .map(j => ({j, items: list.filter(s=>s.jdId===j.id), all: subs().filter(s=>s.jdId===j.id)}))
    .filter(g => {
      const closed = (g.j.status||'Open')==='Closed';
      if (f.jdStatus!=='all' && closed && !g.items.length) return false;
      if (narrowing) return g.items.length || (q && [g.j.title,g.j.client,g.j.skills].join(' ').toLowerCase().includes(q) && !f.status);
      return true;
    })
    .sort((a,b) => (((a.j.status||'Open')==='Closed')-((b.j.status||'Open')==='Closed')) || (b.j.receivedDate||'').localeCompare(a.j.receivedDate||''));
  const known = new Set(jds().map(j=>j.id));
  const loose = list.filter(s => !s.jdId || !known.has(s.jdId));
  let html = '';
  groups.forEach(({j, items, all}) => {
    const sel = all.filter(s=>DECIDED_OK.includes(s.status)).length, intv = all.filter(s=>s.status==='Interviewing').length;
    const need = Math.max(0,(+j.openings||1) - sel);
    html += `<section class="jd-group">
      <div class="jd-gh"><div class="jd-gt"><h2><button class="linkish plain" data-open-jd="${j.id}">${esc(j.title)}</button></h2>
        <div class="jd-gm"><b>${esc(j.client)}</b>${j.experience?` · ${esc(j.experience)}`:''}${j.location?` · ${esc(j.location)}`:''} ${jdStatusPill(j)}</div>
        <div class="jd-stats"><span><b>${all.length}</b> shared</span><span><b>${intv}</b> interviewing</span><span><b>${sel}</b> selected</span><span class="${need&&(j.status||'Open')==='Open'?'need':''}"><b>${need}</b> of ${+j.openings||1} still to fill</span></div></div>
        <div class="actions"><button class="btn sm primary" data-action="new-sub-jd" data-jd="${j.id}">Add profile</button><button class="btn sm" data-action="goto-q" data-jd="${j.id}">Questions</button></div></div>
      ${items.length ? subTable(items,false) : `<p class="empty-note jd-empty">${all.length?'No profiles match these filters.':'No profiles shared for this JD yet.'}</p>`}
    </section>`;
  });
  if (loose.length) html += `<section class="jd-group"><div class="jd-gh"><div class="jd-gt"><h2>Not linked to a JD</h2><div class="jd-gm">Open a profile and choose <b>Edit details</b> to link it to a JD.</div></div></div>${subTable(loose,true)}</section>`;
  if (!html) html = `<p class="empty-note" style="padding:16px">Nothing matches these filters.</p>`;
  if (!jds().length) html = `<div class="hint-box">Add a JD and it appears here as its own section, ready for you to add the profiles you share for it. <button class="btn sm" data-action="new-jd">Add a JD</button></div>` + html;
  return head + filters + html;
}

   </tbody></table></div>`:'<p class="empty-note" style="padding:16px">No JDs match these filters.</p>'}</div>`;

/* ---------- feedback ---------- */
const FB_SOURCES = ['Client','Interviewer','Internal','Candidate'];
const FB_SENT = ['Positive','Neutral','Negative'];
const FB_C = {Positive:'--leaf', Neutral:'--steel', Negative:'--brick'};
function allFeedback(){
  const out = [];
  subs().forEach(s => {
    (s.feedback||[]).forEach(f => out.push({...f, subId:s.id, kind:'entry'}));
    (s.rounds||[]).forEach((r,i) => { if (r.feedback && r.feedback.trim()) out.push({id:'r'+i, subId:s.id, kind:'round', text:r.feedback, source:'Interviewer', round:r.name, at:r.date||s.sharedDate, sentiment: r.outcome==='Cleared'?'Positive':r.outcome==='Rejected'?'Negative':'Neutral'}); });
  });
  return out.sort((a,b)=>(b.at||'').localeCompare(a.at||''));
}
function fbForm(sub){
  const opts = subs().slice().sort((a,b)=>(b.sharedDate||'').localeCompare(a.sharedDate||''));
  const rounds = sub ? (sub.rounds||[]).map(r=>r.name) : [];
  return `<form class="f inline-form" data-form="fb" ${sub?`data-sub="${sub.id}"`:''} style="margin:10px 0 14px">
    ${sub ? '' : fld('Profile', `<select name="subId" required><option value="">Choose a resource…</option>${opts.map(s=>`<option value="${s.id}">${esc(s.candidate)}${s.empId?' ('+esc(s.empId)+')':''} — ${esc(s.client||'')} · ${esc(s.role||'')}</option>`).join('')}</select>`, 'full')}

let qrefs = {}, qrefSeq = 0;
function viewQuestions(){
  const all = allQuestions(), f = state.qf;
  const head = pageHead('Question bank', f.mode==='cand' ? 'Questions each shared resource was asked, with where they stand now.' : 'Questions each client asks, by JD — add your own or record them from interview rounds.', `<div class="seg" role="group" aria-label="View"><button data-action="q-mode" data-m="jd" aria-pressed="${f.mode!=='cand'}">By JD</button><button data-action="q-mode" data-m="cand" aria-pressed="${f.mode==='cand'}">By resource</button></div><button class="btn" data-action="copy-questions">Copy ${f.client?esc(f.client)+'’s':'these'} questions</button>`);
  if (!all.length && !jds().length && !subs().length) return head + `<div class="empty"><h2>No JDs or questions yet</h2><p>Add a JD and it appears here, ready for you to add the questions that client asks. Questions recorded in interview rounds show up here too.</p><button class="btn primary" data-action="new-jd">Add a JD</button></div>`;
  const q = f.q.toLowerCase();
  const scoped = all.filter(x => (!f.client||x.client===f.client));
  const topics = {}; scoped.forEach(x=>x.topics.forEach(t=>{t=t.trim(); if(t) topics[t]=(topics[t]||0)+1;}));
  const tlist = Object.entries(topics).sort((a,b)=>b[1]-a[1]).slice(0,12); const tmax=Math.max(1,...tlist.map(t=>t[1]));
  const match = x => (!f.status || (x.source==='round' && (subById(x.subId)||{}).status===f.status)) && (!f.topic||x.topics.map(t=>t.trim()).includes(f.topic)) && (!q || (x.q+' '+x.role+' '+x.topics.join(' ')).toLowerCase().includes(q));
  const narrowing = !!(q || f.topic || f.status);
  const cls = [...new Set([...jds().map(j=>j.client), ...all.map(x=>x.client)].filter(Boolean))].sort();
  const known = new Set(jds().map(j=>j.id));
  const qItem = (x) => {
    const sources = x.items.map(i => { if (i.source==='jd') return `added to JD${i.round?' · '+esc(i.round):''}`; const st=(subById(i.subId)||{}).status; return `asked to <button class="linkish plain" data-open-sub="${i.subId}">${esc(i.candidate)}</button>${(()=>{const sb=subById(i.subId); return sb&&sb.empId?` (${esc(sb.empId)})`:'';})()}${st?' '+pill(st).replace('class="pill"','class="pill xs"'):''}${i.round?' in '+esc(i.round):''}`; });
    const key = 'g' + (++qrefSeq); qrefs[key] = x.items;
    return `<div class="q"><div><p>${esc(x.q)}</p><small>${[...new Set(sources)].join(' · ')}${x.topics.length?' · '+x.topics.map(esc).join(', '):''}</small></div>
      <div style="display:flex;gap:6px;align-items:flex-start"><span class="times" title="Times asked">${x.items.length>1?'×'+x.items.length:''}</span><button class="qdel" data-action="del-qgroup" data-ref="${key}" title="Delete question" aria-label="Delete question"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3 4h10M6.5 4V2.8h3V4M4.5 4l.6 9h5.8l.6-9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Delete</button></div></div>`;
  };
  const groupQs = arr => { const g={}; arr.forEach(x=>{ const k=normQ(x.q); const e=(g[k] ||= {q:x.q, items:[], topics:[]}); e.items.push(x); x.topics.forEach(t=>{ if(t&&!e.topics.includes(t)) e.topics.push(t); }); }); return Object.values(g).sort((a,b)=>b.items.length-a.items.length); };
  let html = '';
  cls.filter(c => !f.client || c===f.client).forEach(c => {
    const cj = jds().filter(j=>j.client===c).sort((a,b)=>(((a.status||'Open')==='Closed')-((b.status||'Open')==='Closed'))||(b.receivedDate||'').localeCompare(a.receivedDate||''));
    let inner = '';
    cj.forEach(j => {
      const qs = all.filter(x=>x.jdId===j.id);
      const shown = qs.filter(match);
      if ((j.status||'Open')==='Closed' && !qs.length) return;
      if (narrowing && !shown.length && state.qAdd!==j.id) return;
      inner += `<div class="qjd"><div class="qjd-h"><div><b>${esc(j.title)}</b> ${jdStatusPill(j)}<small>${plural(qs.length,'question')}</small></div>
        <button class="btn sm ${state.qAdd===j.id?'':'primary'}" data-action="${state.qAdd===j.id?'cancel-q':'add-q'}" data-jd="${j.id}">${state.qAdd===j.id?'Cancel':'Add questions'}</button></div>
        ${state.qAdd===j.id?qForm(j):''}
        ${shown.length?groupQs(shown).map(qItem).join(''):(state.qAdd===j.id?'':`<p class="empty-note">No questions yet. Add the ones ${esc(c)} asks for this role.</p>`)}</div>`;
    });
    const other = all.filter(x=>x.client===c && (!x.jdId || !known.has(x.jdId))).filter(match);
    if (other.length) inner += `<div class="qjd"><div class="qjd-h"><div><b>Not linked to a JD</b></div></div>${groupQs(other).map(qItem).join('')}</div>`;
    if (inner) html += `<section class="qgroup"><h3>${esc(c)}</h3>${inner}</section>`;
  });
  if (!html) html = '<p class="empty-note">No questions match.</p>';
  if (f.mode==='cand') html = candView(f, q);
  return head + `<div class="filters"><input class="ctl" type="search" placeholder="${f.mode==='cand'?'Search resource or question…':'Search questions…'}" value="${esc(f.q)}" data-qf="q" aria-label="Search">
   <select class="ctl" data-qf="client" aria-label="Client"><option value="">All clients</option>${cls.map(c=>`<option ${f.client===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
   ${f.topic?`<button class="chip" aria-pressed="true" data-topic="">${esc(f.topic)} ✕</button>`:''}</div>
   ${qStatusChips(f)}
   <div class="grid-dash qb"><div class="panel">${html}</div>
   <div class="panel"><h2>Topics probed</h2><p class="sub">Click a topic to filter.</p>${tlist.length?`<div class="hbars">${tlist.map(([t,n])=>`<div class="hb" style="cursor:pointer;grid-template-columns:minmax(80px,120px) 1fr 26px" data-topic="${esc(t)}"><span>${esc(t)}</span><div class="t"><span style="--c:var(--plum);width:${n/tmax*100}%"></span></div><span class="v">${n}</span></div>`).join('')}</div>`:'<p class="empty-note">Add a topic when you add questions to see them here.</p>'}</div></div>`;
}
function qStatusChips(f){
  const base = subs().filter(s => !f.client || s.client===f.client);
  const counts = {}; base.forEach(s=>counts[s.status]=(counts[s.status]||0)+1);
  return `<div class="chips"><span class="chips-l">Resource status</span><button class="chip" data-qstatus="" aria-pressed="${!f.status}">All<b>${base.length}</b></button>${STATUSES.filter(s=>counts[s]).map(s=>`<button class="chip" data-qstatus="${s}" aria-pressed="${f.status===s}">${s}<b>${counts[s]}</b></button>`).join('')}</div>`;

function candView(f, q){
  const qsOf = s => (s.rounds||[]).flatMap(r => (r.questions||[]).map(x => ({q:x, r})));

  if (q) list = list.filter(s => [s.candidate,s.empId,s.role,s.client].join(' ').toLowerCase().includes(q) || qsOf(s).some(x => x.q.toLowerCase().includes(q)));
  if (f.topic) list = list.filter(s => (s.rounds||[]).some(r => (r.topics||[]).map(t=>t.trim()).includes(f.topic)));
  list.sort((a,b) => (qsOf(b).length>0)-(qsOf(a).length>0) || lastActivity(b).localeCompare(lastActivity(a)));
  if (!list.length) return `<p class="empty-note">${subs().length?'No resources match these filters.':'No profiles shared yet. Log a shared profile and add the questions they were asked.'}</p>`;
  return list.map(s => {
    const n = qsOf(s).length;
    const rounds = (s.rounds||[]).filter(r => (r.questions||[]).length && (!f.topic || (r.topics||[]).map(t=>t.trim()).includes(f.topic)));
    return `<section class="cand">
      <div class="cand-h"><div class="who"><b><button class="linkish plain" data-open-sub="${s.id}">${esc(s.candidate)}</button> ${empTag(s)} ${pill(s.status)}${s.status==='Rejected'&&s.rejectionReason?` <span class="muted" style="font-weight:400;font-size:13px">${esc(s.rejectionReason)}</span>`:''}</b>
        <small>${esc(s.client||'—')} · ${esc(s.role||'—')} · shared ${fmtDate(s.sharedDate)} · ${plural(n,'question')}</small></div>
        <button class="btn sm ${state.cqAdd===s.id?'':'primary'}" data-action="${state.cqAdd===s.id?'cancel-cq':'add-cq'}" data-sub="${s.id}">${state.cqAdd===s.id?'Cancel':'Add questions'}</button></div>
      ${state.cqAdd===s.id ? cqForm(s) : ''}
      ${rounds.length ? rounds.map(r => `<div class="cr"><div class="cr-h"><b>${esc(r.name||'Round')}</b><span class="muted">${fmtDate(r.date)}${r.interviewer?' · '+esc(r.interviewer):''}</span>${pill(r.outcome||'Pending',OUT_C)}${(r.topics||[]).length?`<span class="muted">${r.topics.map(esc).join(', ')}</span>`:''}</div>
        <ol>${r.questions.filter(x => !q || [s.candidate,s.role,s.client].join(' ').toLowerCase().includes(q) || x.toLowerCase().includes(q)).map(x=>`<li class="qli"><span>${esc(x)}</span><button class="qdel" data-action="del-rq" data-sub="${s.id}" data-ri="${(s.rounds||[]).indexOf(r)}" data-qi="${r.questions.indexOf(x)}" title="Delete question" aria-label="Delete question"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path d="M3 4h10M6.5 4V2.8h3V4M4.5 4l.6 9h5.8l.6-9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Delete</button></li>`).join('')}</ol></div>`).join('')
        : (state.cqAdd===s.id ? '' : `<p class="empty-note" style="padding:2px 0 0">No questions recorded for ${esc(s.candidate)} yet.</p>`)}
    </section>`;
  }).join('');
}

function openDrawer(d){ state.fbSub=null; Object.assign(pending,{file:null, tab:'file', text:'', fileText:'', sourceText:''}); state.drawer=d; state.lock = d.type.endsWith('form'); state.roundEdit=null; renderDrawer(); $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); $('#drawer').setAttribute('aria-hidden','false'); setTimeout(()=>{ const el=$('#drawer input, #drawer .x'); el&&el.focus(); },260); }
function closeDrawer(){ state.fbSub=null; state.drawer=null; state.lock=false; state.roundEdit=null; $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on'); $('#drawer').setAttribute('aria-hidden','true'); }
function renderDrawer(){
  const d = state.drawer, el = $('#drawer'); if(!d) return;
  let head='', body='';
  if (d.type==='sub-form'){ const s = d.id ? subById(d.id) : null; head = dh(s?'Edit profile':'Log a shared profile', s?esc(s.candidate):'Record a resource you sent to a client.'); body = subForm(s); }
  else if (d.type==='jd-form'){ const j = d.id ? jdById(d.id) : null; head = dh(j?'Edit JD':'Add a JD', j?esc(j.title):'A requirement a client sent you.'); body = jdForm(j); }
  else if (d.type==='sub'){ const s = subById(d.id); if(!s){ closeDrawer(); return; } head = dh(esc(s.candidate)+(s.empId?` ${empTag(s)}`:''), `${esc(s.role||'')}${s.client?' at '+esc(s.client):''}`); body = subDetail(s); }
  else if (d.type==='jd'){ const j = jdById(d.id); if(!j){ closeDrawer(); return; } head = dh(esc(j.title), esc(j.client)); body = jdDetail(j); }
  el.innerHTML = head + `<div class="dbody">${body}</div>`;
}

function subDetail(s){
  const jd = s.jdId ? jdById(s.jdId) : null;

function md(t){
  const lines = esc(t).split('\n'); let html='', inList=false;
  for (let l of lines){
    l = l.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if (/^#{1,4}\s/.test(l)){ if(inList){html+='</ul>';inList=false;} html+=`<h4>${l.replace(/^#{1,4}\s/,'')}</h4>`; }
    else if (/^\s*([-*]|\d+\.)\s/.test(l)){ if(!inList){html+='<ul>';inList=true;} html+=`<li>${l.replace(/^\s*([-*]|\d+\.)\s/,'')}</li>`; }
    else if (l.trim()===''){ if(inList){html+='</ul>';inList=false;} }
    else { if(inList){html+='</ul>';inList=false;} html+=`<p style="margin:6px 0">${l}</p>`; }
  }
  return html + (inList?'</ul>':'');
}
