const ALL_ACCEPT = '.pdf,.docx,.txt,.md,.png,.jpg,.jpeg,.webp,application/pdf,text/plain,image/png,image/jpeg,image/webp,application/vnd.openxmlformats-officedocument.wordprocessingml.document';
const fileKind = f => { const n=(f.name||'').toLowerCase(), t=f.type||'';
  if (/\.pdf$/.test(n)||t==='application/pdf') return 'pdf';
  if (/\.docx$/.test(n)||t.includes('wordprocessingml')) return 'docx';
  if (/\.(png|jpe?g|webp)$/.test(n)||/^image\/(png|jpeg|webp)$/.test(t)) return 'img';
  if (/\.(txt|md)$/.test(n)||/^text\//.test(t)) return 'txt';
  if (/\.doc$/.test(n)) return 'doc'; return ''; };
const imgType = f => { const n=(f.name||'').toLowerCase(); return /\.png$/.test(n)?'image/png':/\.webp$/.test(n)?'image/webp':'image/jpeg'; };
function checkFile(file, recordOnly){
  if (!file) return false;
  const k = fileKind(file);
  if (k==='doc') { toast('Old .doc files can’t be read — save it as .docx or PDF, or paste the text.'); return false; }
  if (!k) { toast('Choose a PDF, Word (.docx), image (JPG/PNG) or text file.'); return false; }
  if (recordOnly && !FileStore.keeps(file)) { toast(`This file type can’t be stored here — attach a ${FileStore.acceptLabel()}.`); return false; }
  if (file.size > 20*1048576) { toast('That file is over 20 MB — compress it and try again.'); return false; }
  return true;
}
/* Files: claude.ai asset store when published, IndexedDB in a downloaded copy */
const FileStore = {
  idb:null,
  mode(){ return Store.mode==='server' ? 'server' : GAS_ON ? 'drive' : Store.mode==='db' ? '' : caps.assets ? 'assets' : (window.indexedDB ? 'idb' : ''); },
  canSave(){ return !!this.mode(); },
  keeps(f){ const k=fileKind(f); return (['idb','drive','server'].includes(this.mode())) ? !!k && k!=='doc' : this.mode()==='assets' ? ['pdf','txt','img'].includes(k) : false; },
  accept(){ return (['idb','drive','server'].includes(this.mode())) ? ALL_ACCEPT : '.pdf,.txt,.png,.jpg,.jpeg,.webp,application/pdf,text/plain,image/png,image/jpeg,image/webp'; },
  acceptLabel(){ return (['idb','drive','server'].includes(this.mode())) ? 'PDF, Word, image or text file' : 'PDF, image or text file'; },
  open(){ if (this.idb) return this.idb; this.idb = new Promise((res, rej) => { const r = indexedDB.open('talentdesk-files', 1); r.onupgradeneeded = () => r.result.createObjectStore('files'); r.onsuccess = () => res(r.result); r.onerror = () => { this.idb=null; rej(r.error); }; }); return this.idb; },
  async tx(mode, fn){ const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('files', mode); const st = t.objectStore('files'); const out = fn(st); t.oncomplete = () => res(out && out.result!==undefined ? out.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); }); },
  async save(file){
    const k = fileKind(file);
    if (this.mode()==='server'){
      if (file.size > 25*1048576) { toast('Files over 25 MB can’t be uploaded — compress it first.'); throw new Error('too large'); }
      try { const r = await api('POST', `api/files?name=${encodeURIComponent(file.name)}&type=${encodeURIComponent(file.type||'application/octet-stream')}`, file, true); return {id:r.id, url:r.url.replace(/^\//,''), name:file.name, size:file.size, at:nowISO(), type:file.type||'', store:'server'}; }
      catch(e){ toast('Couldn’t upload the file: ' + e.message); throw e; }
    }
    if (this.mode()==='drive'){
      if (file.size > 15*1048576) { toast('Files over 15 MB can’t be uploaded to the shared drive — compress it first.'); throw new Error('too large'); }
      const b64 = (await blobToDataUrl(file)).split(',')[1];
      try { const r = JSON.parse(await gas('uploadFile', file.name, file.type || 'application/octet-stream', b64)); return {id:r.id, url:r.url, name:file.name, size:file.size, at:nowISO(), type:file.type||'', store:'drive'}; }
      catch(e){ toast('Couldn’t upload the file: ' + (e && e.message || e)); throw e; }
    }
    if (this.mode()==='assets'){
      const type = k==='pdf'?'application/pdf':k==='img'?imgType(file):'text/plain';
      const go = async () => { const r = await caps.assets.upload(file, {type}); return {id:r.id, name:file.name, size:r.sizeBytes||file.size, at:nowISO(), type, store:'assets'}; };
      try { return await go(); }
      catch(e){
        if (e.code==='store_unavailable') { await new Promise(r=>setTimeout(r,800)); return await go(); }
        toast(e.code==='too_large'?'That file is too large to store.': e.code==='quota_or_state'?'Attachment storage is full — remove some old files.': e.code==='not_granted'?'You don’t have permission to attach files here.': e.code==='invalid_request'?'That text file isn’t UTF-8 — save it as UTF-8 or attach a PDF.':'Couldn’t upload the file. Try again.');
        throw e;
      }
    }
    const id = 'f_' + uid();
    try { await this.tx('readwrite', st => st.put(file, id)); }
    catch(e){ toast('Couldn’t save the file in this browser — storage may be full or blocked.'); throw e; }
    return {id, name:file.name, size:file.size, at:nowISO(), type:file.type||'', store:'idb'};
  },
  async remove(meta){
    if (!meta || !meta.id) return;
    try { if (meta.store==='server') await api('DELETE', `api/files/${meta.id}`); else if (meta.store==='drive') await gas('deleteFile', meta.id); else if (meta.store==='idb') await this.tx('readwrite', st => st.delete(meta.id)); else if (caps.assets) await caps.assets.delete(meta.id); } catch(e){}
  },
  async openFile(meta){
    if (meta.store==='drive' || meta.store==='server') { window.open(meta.url, '_blank', 'noopener'); return; }
    if (meta.store!=='idb') { window.open(blobUrl(meta.id), '_blank', 'noopener'); return; }
    const w = window.open('', '_blank');
    let blob; try { blob = await this.tx('readonly', st => st.get(meta.id)); } catch(e){}
    if (!blob) { if (w) w.close(); toast('This file isn’t stored in this browser — it was attached on another computer or browser.'); return; }
    const url = URL.createObjectURL(blob);
    if (fileKind(meta)==='docx' || !w) { if (w) w.close(); const a=document.createElement('a'); a.href=url; a.download=meta.name; document.body.appendChild(a); a.click(); a.remove(); }
    else w.location.href = url;
    setTimeout(()=>URL.revokeObjectURL(url), 60000);
  }
};

  const nice = (j.niceToHave||'').split(',').map(x=>x.trim()).filter(Boolean);
  let t = `## What ${j.client} looks for\n`;
  t += `- Role: **${j.title}**${j.experience?` · ${j.experience}`:''}${j.location?` · ${j.location}`:''}${j.employment?` · ${j.employment}`:''}\n`;
  if (skills.length) t += `- Must-have skills: ${skills.join(', ')}\n`;
  if (nice.length) t += `- Nice to have: ${nice.join(', ')}\n`;
  if (topT.length) t += `- Topics they probe most in interviews: ${topT.join(', ')}\n`;
  if (cs.length) t += `- Track record: ${sel} of ${cs.length} profiles shared to ${j.client} were selected (${pct(sel,cs.length)}%)\n`;
  t += `\n## Likely questions\n`;
  if (qs.length) {
    const groups = {}; qs.forEach(q => (groups[q.topic||'General'] ||= []).push(q));
    Object.entries(groups).forEach(([g, arr]) => { t += `**${g}**\n` + arr.map(q=>`- ${q.q}${q.n>1?` (asked ${q.n}×)`:''}`).join('\n') + '\n'; });
  } else {
    t += `- No questions recorded for ${j.client} yet. Prepare to explain hands-on work with: ${skills.slice(0,6).join(', ')||'the core skills in the JD'}\n`;
    if (skills.length) t += skills.slice(0,5).map(s=>`- Walk through a real project where you used ${s} — what you built, problems faced, how you solved them`).join('\n') + '\n';
  }
  t += `\n## Watch-outs\n`;
  const rcl = Object.entries(rc).sort((a,b)=>b[1]-a[1]);
  if (rcl.length) {
    rcl.forEach(([r,n]) => t += `- ${n} candidate${n>1?'s were':' was'} rejected for **${r.toLowerCase()}**${r==='Communication'?' — practise explaining answers clearly and concisely':r==='Failed technical round'||r==='Skill mismatch'?' — revise the must-have skills in depth':r==='Notice period'?' — confirm notice period and early-release options upfront':r==='Rate / budget'?' — align expected CTC with the budget before the call':''}\n`);
    const screen = rej.filter(s=>!(s.rounds||[]).length).length;
    if (screen) t += `- ${screen} of ${rej.length} rejections happened before an interview — make sure the resume clearly shows the must-have skills\n`;
  } else t += `- No rejections recorded at ${j.client} yet\n`;
  t += `\n## Quick checklist before the call\n- Re-read the JD and match each must-have skill to a project on the resume\n- Prepare 2–3 examples with numbers (scale, impact, results)\n${topT.length?`- Revise: ${topT.slice(0,4).join(', ')}\n`:''}- Confirm notice period, current and expected CTC\n- Test camera, mic and internet 15 minutes before; keep the resume open\n`;
  return t;
}
function saveBlobFile(filename, data, mime){
  const blob = data instanceof Blob ? data : new Blob([data], {type:mime||'application/octet-stream'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 30000);
}
async function saveFileOut(filename, data, mime){
  if (GAS_ON) {
    try {
      const text = data instanceof Blob ? await data.text() : data;
      const url = await gas('saveExport', filename, mime || 'text/plain', text);
      showNotice(`<b>${esc(filename)}</b> is ready in your Google Drive.`, url, 'Open file');
      return true;
    } catch(e){ toast('Couldn’t save the file: ' + (e && e.message || e)); return false; }
  }
  if (caps.downloads) {
    try { await caps.downloads.save({filename, data: data instanceof Blob ? data : new Blob([data],{type:mime})}); return true; }
    catch(e){ if (e.code==='declined') return false; toast('Couldn’t save the file: '+(e.message||e.code)); return false; }
  }
  saveBlobFile(filename, data, mime); return true;
}
const blobToDataUrl = b => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(b); });
async function fileBlob(meta){
  if (!meta) return null;
  try {
    if (meta.store==='server') { const r = await fetch(meta.url); return r.ok ? await r.blob() : null; }
    if (meta.store==='drive') { const r = JSON.parse(await gas('getFileB64', meta.id)); return await (await fetch(`data:${r.mime};base64,${r.data}`)).blob(); }
    if (meta.store==='idb') return await FileStore.tx('readonly', st => st.get(meta.id)) || null;
    const r = await fetch(blobUrl(meta.id)); return r.ok ? await r.blob() : null;
  } catch(e){ return null; }
}
async function backupData(){
  toast('Preparing backup…');
  const pack = async (rec, field) => { const out = {...rec}; delete out.id; out._id = rec.id; if (rec[field]) { const b = await fileBlob(rec[field]); if (b) out[field] = {...rec[field], data: await blobToDataUrl(b)}; } return out; };
  const data = { app:'talent-desk', version:1, exportedAt:nowISO(),
    jds: await Promise.all(jds().map(j => pack(j,'file'))),
    submissions: await Promise.all(subs().map(s => pack(s,'resume'))) };
  const ok = await saveFileOut(`sedin-talent-desk-backup-${today()}.json`, JSON.stringify(data), 'application/json');
  if (ok) toast('Backup saved — keep it safe; you can restore it into any copy of Sedin Talent Desk');
}
async function restoreData(file){
  let data; try { data = JSON.parse(await file.text()); } catch(e){ toast('That isn’t a Sedin Talent Desk backup file.'); return; }
  if (!data || data.app!=='talent-desk' || !Array.isArray(data.jds) || !Array.isArray(data.submissions)) { toast('That isn’t a Sedin Talent Desk backup file.'); return; }
  if (!await askConfirm(`Restore ${plural(data.jds.length,'JD')} and ${plural(data.submissions.length,'profile')}? Records you already have are skipped, nothing is deleted.`, 'Restore')) return;
  const unpack = async meta => { if (!meta || !meta.data) return null; try { const b = await (await fetch(meta.data)).blob(); const f = new File([b], meta.name||'file', {type: meta.type || b.type}); if (!FileStore.keeps(f)) return null; return await FileStore.save(f); } catch(e){ return null; } };
  const jdKey = j => [j.title,j.client,j.receivedDate].join('|').toLowerCase();
  const subKey = s => [s.candidate,s.client,s.sharedDate,s.role].join('|').toLowerCase();
  const haveJ = new Map(jds().map(j=>[jdKey(j), j.id])), haveS = new Set(subs().map(subKey));
  const idMap = {}; let nj=0, ns=0, nf=0;
  toast('Restoring…');
  for (const j of data.jds) {
    const k = jdKey(j); if (haveJ.has(k)) { idMap[j._id] = haveJ.get(k); continue; }
    const {_id, createdAt, updatedAt, ...rest} = j; if (rest.file) { const m = await unpack(rest.file); if (m) nf++; rest.file = m; }
    idMap[_id] = await Store.add('jds', rest); nj++;
  }
  for (const s of data.submissions) {
    if (haveS.has(subKey(s))) continue;
    const {_id, createdAt, updatedAt, ...rest} = s; if (rest.resume) { const m = await unpack(rest.resume); if (m) nf++; rest.resume = m; }
    if (rest.jdId) rest.jdId = idMap[rest.jdId] || '';
    await Store.add('submissions', rest); ns++;
  }
  toast(nj||ns ? `Restored ${plural(nj,'JD')}, ${plural(ns,'profile')}${nf?` and ${plural(nf,'file')}`:''}` : 'Everything in that backup is already here');
}

      const sb = subById(f.dataset.sub || v.subId);
      if (!sb || !(v.text||'').trim()) { btn.disabled=false; toast(sb?'Type or paste the feedback first.':'Choose a profile first.'); return; }
      const entry = {id:uid(), text:v.text.trim(), source:v.source||'Client', round:v.round||'', sentiment:v.sentiment||'Neutral', at:v.at||today()};
      await Store.update('submissions', sb.id, {feedback:[...(sb.feedback||[]), entry]});
      f.querySelectorAll('[data-keep]').forEach(el=>el.value='');
      if (f.dataset.sub) { state.fbSub=null; state.lock=false; renderDrawer(); } else { state.fbAdd=false; renderView(); }
      renderNav(); toast(`Feedback saved for ${sb.candidate}`);
    } else if (f.dataset.form==='candq'){
      const sb = subById(f.dataset.sub);
      const lines = (v.questions||'').split('\n').map(x=>x.replace(/^\s*(\d+[.)]|[-*•])\s*/,'').trim()).filter(Boolean);
      if (!lines.length) { btn.disabled=false; return; }
      const topics = (v.topic||'').split(',').map(x=>x.trim()).filter(Boolean);
      const rounds = clone(sb.rounds||[]);
      const ex = rounds.find(r => (r.name||'').toLowerCase()===(v.round||'').toLowerCase());
      let added = lines.length;
      if (ex) {
        const have = new Set((ex.questions||[]).map(normQ));
        const nq = lines.filter(l=>!have.has(normQ(l))); added = nq.length;
        ex.questions = [...(ex.questions||[]), ...nq];
        ex.topics = [...new Set([...(ex.topics||[]), ...topics])];
        if (v.outcome && v.outcome!=='Pending') ex.outcome = v.outcome;
      } else {
        rounds.push({name:v.round, date:v.date||today(), interviewer:'', mode:'Video', outcome:v.outcome||'Pending', topics, questions:lines, feedback:''});
        rounds.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      }
      const patch = {rounds};
      if (['Shared','Shortlisted'].includes(sb.status)) { patch.status='Interviewing'; patch.history=[...(sb.history||[]),{status:'Interviewing',at:today()}]; }
      await Store.update('submissions', sb.id, patch);
      f.querySelectorAll('[data-keep]').forEach(el=>el.value='');
      state.cqAdd=null; renderView(); renderNav();
      toast(added ? `Added ${plural(added,'question')} for ${sb.candidate}${patch.status?' — moved to Interviewing':''}` : 'Those questions are already recorded');
    } else if (f.dataset.form==='jdq'){
      const j = jdById(f.dataset.jd);
      const lines = (v.questions||'').split('\n').map(x=>x.replace(/^\s*(\d+[.)]|[-*•])\s*/,'').trim()).filter(Boolean);
      if (!lines.length) { btn.disabled=false; return; }
      const existing = new Set((j.questions||[]).map(x=>normQ(x.q)));
      const add = lines.filter(l=>!existing.has(normQ(l))).map(l=>({id:uid(), q:l, topic:v.topic||'', round:v.round||'', at:today()}));
      if (add.length) await Store.update('jds', j.id, {questions:[...(j.questions||[]), ...add]});
      f.querySelectorAll('[data-keep]').forEach(el=>el.value='');
      state.qAdd=null; renderView(); renderNav();
      toast(add.length ? `Added ${plural(add.length,'question')} to ${j.title}` : 'Those questions are already on this JD');
    } else if (f.dataset.form==='round'){
      const s = subById(state.drawer.id); const rounds = clone(s.rounds||[]);
      const r = {name:v.name, date:v.date, interviewer:v.interviewer, mode:v.mode, outcome:v.outcome, feedback:v.feedback,
        topics: v.topics.split(',').map(x=>x.trim()).filter(Boolean), questions: v.questions.split('\n').map(x=>x.replace(/^\s*(\d+[.)]|[-*•])\s*/,'').trim()).filter(Boolean)};
      const i = f.dataset.i; if (i==='new') rounds.push(r); else rounds[+i]=r;
      rounds.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
      const patch = {rounds};
      if (['Shared','Shortlisted'].includes(s.status)) { patch.status='Interviewing'; patch.history=[...(s.history||[]),{status:'Interviewing',at:today()}]; }
      await Store.update('submissions', s.id, patch);
      state.roundEdit=null; state.lock=false; renderDrawer();
      if (r.outcome==='Rejected' && s.status!=='Rejected') toast('Round saved. Mark the profile Rejected under “Update status” if the client has passed.');
      else toast('Round saved');
    }
    if (oldFile && oldFile.id !== (v.file||v.resume||{}).id) dropAsset(oldFile);
  } catch(err){ btn.disabled=false; btn.textContent=btnText; }
});
